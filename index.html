<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agrinex Weather Station Dashboard</title>

    <!-- Instant Inline CSS for zero-latency initial HTML skeleton render -->
    <style>
      body {
        background-color: #e6e9ef;
        color: #1f2937;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 0;
      }
      .app-skeleton {
        max-width: 1280px;
        margin: 0 auto;
        padding: 16px;
        box-sizing: border-box;
      }
      .sk-card {
        background: #e6e9ef;
        box-shadow: 8px 8px 16px #c5c8cf, -8px -8px 16px #ffffff;
        border-radius: 24px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .sk-pressed {
        background: #e6e9ef;
        box-shadow: inset 4px 4px 8px #c5c8cf, inset -4px -4px 8px #ffffff;
        border-radius: 16px;
      }
      .sk-pulse {
        animation: sk-pulse-anim 1.5s ease-in-out infinite;
        background: rgba(197, 200, 207, 0.4);
        border-radius: 12px;
      }
      @keyframes sk-pulse-anim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .sk-flex { display: flex; align-items: center; justify-content: space-between; }
      .sk-grid { display: grid; gap: 16px; }
      @media (min-width: 768px) {
        .sk-grid-3 { grid-template-columns: repeat(3, 1fr); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant Initial Skeleton HTML displayed while JS bundles load -->
      <div class="app-skeleton">
        <!-- Top Header Skeleton -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <div class="sk-pulse" style="height: 28px; width: 140px; border-radius: 999px;"></div>
          <div class="sk-pressed" style="height: 32px; width: 120px; border-radius: 999px;"></div>
        </div>

        <!-- Title Skeleton -->
        <div style="margin-bottom: 24px;">
          <div class="sk-pulse" style="height: 14px; width: 60px; margin-bottom: 8px;"></div>
          <div class="sk-pulse" style="height: 36px; width: 220px; margin-bottom: 12px;"></div>
          <div class="sk-pulse" style="height: 16px; width: 160px; margin-bottom: 16px;"></div>
          <div class="sk-pulse" style="height: 28px; width: 180px;"></div>
        </div>

        <!-- Calendar Card Skeleton -->
        <div class="sk-card" style="display: flex; justify-content: space-between; align-items: center;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="sk-pulse" style="height: 48px; width: 48px; border-radius: 12px;"></div>
            <div>
              <div class="sk-pulse" style="height: 16px; width: 80px; margin-bottom: 6px;"></div>
              <div class="sk-pulse" style="height: 12px; width: 60px;"></div>
            </div>
          </div>
          <div class="sk-pressed" style="height: 44px; width: 140px; border-radius: 20px;"></div>
        </div>

        <!-- Cards Grid Skeleton -->
        <div class="sk-grid sk-grid-3">
          <div class="sk-card" style="height: 240px; display: flex; flex-direction: column; justify-content: space-between;">
            <div class="sk-pulse" style="height: 16px; width: 100px;"></div>
            <div class="sk-pulse" style="height: 120px; width: 120px; border-radius: 50%; margin: 0 auto;"></div>
            <div class="sk-pulse" style="height: 14px; width: 100%;"></div>
          </div>

          <div class="sk-grid" style="grid-template-columns: 1fr; gap: 12px;">
            <div class="sk-card" style="height: 64px;"></div>
            <div class="sk-card" style="height: 64px;"></div>
            <div class="sk-card" style="height: 64px;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
